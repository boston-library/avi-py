name: CI
 
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
 
env:
  PYTHON: "3.10.20"
  KAKADU_HOME: /opt/kakadu
  AVI_DEBUG: "true"
  MAGICK_MEMORY_LIMIT: "512"
  OMP_THREAD_LIMIT: "1"
 
jobs:
  build:
    runs-on: ubuntu-22.04
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
